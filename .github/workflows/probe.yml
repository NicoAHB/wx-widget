# Vorübergehend: prüft, welche Nachrichten- und Terminquellen für Kryptowährungen von GitHub aus erreichbar sind und wie
# ihre Daten aussehen. Läuft nur auf Arbeitszweigen und wird vor dem nächsten Pull Request wieder entfernt.
name: Quellen-Test (vorübergehend)
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Binance-Details und Google-News-Filter ansehen
        run: |
          cat > probe.mjs <<'EOF'
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const get = async (u) => { const r = await fetch(u, { headers: { 'user-agent': 'Mozilla/5.0 (ScalpDesk-Test)', 'accept-language': 'de-DE,de;q=0.9,en;q=0.8' } }); return { status: r.status, text: await r.text() }; };
          // 1) Liste je Katalog
          for (const cat of [161, 157]) {
            const l = await get(`https://www.binance.com/bapi/composite/v1/public/cms/article/catalog/list/query?catalogId=${cat}&pageNo=1&pageSize=20`);
            console.log(`\nCATALOG ${cat}: ${l.status} ${l.text.slice(0, 160)}`);
          }
          const list = JSON.parse((await get('https://www.binance.com/bapi/composite/v1/public/cms/article/list/query?type=1&pageNo=1&pageSize=30')).text);
          const all = list.data.catalogs.flatMap(c => c.articles.map(a => ({ ...a, cat: c.catalogId })));
          console.log('ANZAHL', all.length, list.data.catalogs.map(c => `${c.catalogId}:${c.articles.length}`).join(' '));
          const show = all.filter(a => /Removal of Spot|Margin And Loans Token Delist|Will Delist|Monitoring Tag|Network Upgrade|Migration|Will List|Futures Will Delist|Swap|Merge/i.test(a.title)).slice(0, 9);
          for (const a of show) {
            const d = JSON.parse((await get(`https://www.binance.com/bapi/composite/v1/public/cms/article/detail/query?articleCode=${a.code}`)).text).data;
            const walk = n => typeof n === 'string' ? n : Array.isArray(n) ? n.map(walk).join('') : n && typeof n === 'object' ? (n.node === 'text' ? n.text : (walk(n.child || []) + (/^(p|li|h\d|tr|br)$/.test(n.tag) ? '\n' : n.tag === 'td' ? ' | ' : ''))) : '';
            let body; try { body = walk(JSON.parse(d.body)); } catch { body = String(d.body).slice(0, 200); }
            console.log(`\n=== [${a.cat}] ${a.title}\n pairs=${JSON.stringify(d.pairs)?.slice(0, 300)} seoKeywords=${JSON.stringify(d.seoKeywords)?.slice(0, 200)}`);
            console.log(' UTC:', [...body.matchAll(/\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}(?::\d{2})?\s*\(UTC\)/g)].map(m => m[0]).slice(0, 5).join(' | '));
            console.log(' BODY:', body.replace(/\n+/g, ' ¶ ').slice(0, 900));
            await sleep(300);
          }
          // 2) Google News mit Stichwort-Filter (Entwurf)
          const COINS = [
            ['BTC', 'Bitcoin', /\bbitcoins?\b(?![- ]?(cash|sv)\b)|\bBTC\b/i], ['ETH', 'Ethereum', /\bethereum\b(?![- ]?classic)|\bETH\b/i],
            ['XRP', 'XRP OR Ripple', /\bXRP\b|\bripple\b/i], ['BCH', '"Bitcoin Cash"', /bitcoin[- ]?cash|\bBCH\b/i],
            ['LTC', 'Litecoin', /litecoin|\bLTC\b/i], ['ETC', '"Ethereum Classic"', /ethereum[- ]?classic|\bETC\b(?!\.)/],
            ['NEAR', '"NEAR Protocol"', /near[- ]?protocol|\bNEAR\b/], ['SOL', 'Solana', /solana|\bSOL\b/], ['DOGE', 'Dogecoin', /dogecoin|\bDOGE\b/i],
            ['ADA', 'Cardano', /cardano|\bADA\b/], ['TRX', 'TRX OR "Justin Sun" OR "Tron-Netzwerk"', /\bTRX\b|\btron\b/i], ['LINK', 'Chainlink', /chainlink|\bLINK\b/],
            ['SUI', 'Sui Krypto OR Blockchain OR Token', /\bsui\b/i], ['AVAX', 'Avalanche AVAX OR Krypto', /avalanche|\bAVAX\b/i], ['PEPE', 'Pepe Memecoin OR Krypto OR Coin', /\bpepe\b/i],
          ];
          const NOISE = /prognose|kursziel|preisvorhersage|so viel|investition von vor|investment in .{0,40} von vor|wie sich die kryptokurse|so bewegen sich|am (vor|nach)mittag|am (morgen|abend)\b|\btop[- ]?\d|kaufen\?|lohnt sich|chartanalyse|price prediction|was (jetzt|nun) passiert|presale|vorverkauf|\bwale?\b|explodier|rallye|verdoppel|verdreifach|kaufsignal|verkaufssignal|shiba|memecoin(s)? mit|nächste[nr]? \w+coin/i;
          const CATS = [
            ['etf', 'high', /\bETFs?\b.{0,60}(zulass|zugelassen|genehmig|abgelehnt|ablehn|entscheid|start|antrag|beantragt|frist|\bSEC\b)|(\bSEC\b|zulass|genehmig|entscheid).{0,60}\bETFs?\b/i],
            ['recht', 'high', /\bSEC\b|\bCFTC\b|klage|verklagt|gericht|urteil|richter|anklage|festgenommen|verhaftet|geldstrafe|sanktion|verbot|verbiet|\bbafin\b|\bmica\b|lizenz/i],
            ['sicherheit', 'high', /hack|gehackt|exploit|angriff|attacke|gestohlen|diebstahl|sicherheitslücke|\bbug\b|51[ -]?%|betrug/i],
            ['netz', 'high', /hard[- ]?fork|\bfork\b|upgrade|mainnet|ausfall|störung|stillstand|outage|halving|halbierung/i],
            ['boerse', 'high', /delist|handel (eingestellt|ausgesetzt|gestoppt)|(listet|listing|gelistet|aufgenommen).{0,40}(coinbase|binance|robinhood|upbit|kraken)|(coinbase|binance|robinhood|upbit|kraken).{0,40}(listet|listing|gelistet|nimmt .{0,20} auf)/i],
            ['etf-fluss', 'medium', /\bETFs?\b/i],
            ['angebot', 'medium', /escrow|unlock|freischaltung|freigabe|burn|verbrenn|treasury|reserve/i],
            ['firma', 'medium', /insolvenz|pleite|bankrott|übernahme|übernimmt|partnerschaft|kooperation|börsengang|\bIPO\b/i],
          ];
          const dec = s => s.replace(/<!\[CDATA\[|\]\]>/g, '').replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&lt;/g, '<').replace(/&gt;/g, '>');
          for (const [sym, q, re] of COINS) {
            const g = await get(`https://news.google.com/rss/search?q=${encodeURIComponent(q + ' when:2d')}&hl=de&gl=DE&ceid=DE:de`);
            const items = [...g.text.matchAll(/<item>([\s\S]*?)<\/item>/g)].map(m => { const f = t => dec((m[1].match(new RegExp(`<${t}[^>]*>([\\s\\S]*?)</${t}>`)) || [])[1] || ''); return { t: f('pubDate'), src: f('source'), title: f('title').replace(/ - [^-]+$/, '') }; });
            const out = { total: items.length, offTopic: 0, noise: 0, none: 0, high: [], medium: [] };
            for (const it of items) {
              if (!re.test(it.title)) { out.offTopic++; continue; }
              if (NOISE.test(it.title)) { out.noise++; continue; }
              const c = CATS.find(([, , r]) => r.test(it.title));
              if (!c) { out.none++; if (['XRP', 'BCH', 'BTC'].includes(sym) && out.none <= 6) console.log(`   (ohne) ${sym}: ${it.title}`); continue; }
              out[c[1]].push(`${c[0]} | ${new Date(it.t).toISOString().slice(5, 16)} | ${it.src} | ${it.title}`);
            }
            console.log(`\nGN ${sym} (${q}): ${g.status} gesamt ${out.total}, fremd ${out.offTopic}, Rauschen ${out.noise}, ohne ${out.none}, hoch ${out.high.length}, mittel ${out.medium.length}`);
            for (const l of out.high.slice(0, 10)) console.log('   H', l);
            for (const l of out.medium.slice(0, 4)) console.log('   M', l);
            await sleep(700);
          }
          EOF
          node probe.mjs
