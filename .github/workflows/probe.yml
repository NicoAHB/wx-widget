# Vorübergehend: prüft, welche Nachrichten- und Terminquellen für Kryptowährungen von GitHub aus erreichbar sind.
# Läuft nur auf Arbeitszweigen und wird vor dem nächsten Pull Request wieder entfernt.
name: Quellen-Test (vorübergehend)
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Quellen abfragen
        run: |
          probe() {
            r=$(curl -sS -m 20 -A "Mozilla/5.0 (ScalpDesk-Test)" -H "Origin: https://nicoahb.github.io" -D hdr -o body -w '%{http_code} | %{content_type} | %{size_download} Bytes' "$1" 2>&1) || true
            echo "== $1"; echo "   $r"; grep -i '^access-control-allow-origin' hdr | tr -d '\r' | sed 's/^/   /'
            head -c 500 body | tr '\n\r\t' '   ' | cut -c1-500; echo; echo
          }
          probe "https://min-api.cryptocompare.com/data/v2/news/?lang=EN&categories=XRP"
          probe "https://data-api.coindesk.com/news/v1/article/list?lang=EN&limit=5&categories=XRP"
          probe "https://cryptopanic.com/api/developer/v2/posts/?public=true&currencies=XRP&filter=important"
          probe "https://cryptopanic.com/api/v1/posts/?public=true&currencies=XRP&filter=important"
          probe "https://developers.coinmarketcal.com/v1/events"
          probe "https://www.binance.com/bapi/composite/v1/public/cms/article/list/query?type=1&pageNo=1&pageSize=5"
          probe "https://cointelegraph.com/rss/tag/xrp"
          probe "https://www.coindesk.com/arc/outboundfeeds/rss/"
          probe "https://decrypt.co/feed"
          probe "https://news.google.com/rss/search?q=XRP+when:2d&hl=de&gl=DE&ceid=DE:de"
          probe "https://data.messari.io/api/v1/news/xrp"
