# Vorübergehend: führt den Coin-News-Job probeweise aus (ohne Ablage im Zweig „news“) und zeigt das Ergebnis.
# Läuft nur auf Arbeitszweigen und wird vor dem nächsten Pull Request wieder entfernt.
name: Quellen-Test (vorübergehend)
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml', '.github/news/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/news
          persist-credentials: false
      - name: Coin-News probeweise sammeln
        run: |
          curl -fsS --max-time 30 -o prev.json "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/news/news.json" || echo "Noch kein voriger Stand."
          code=0; start=$(date +%s)
          node .github/news/build.mjs prev.json news.json || code=$?
          echo "Exit $code nach $(( $(date +%s) - start )) s"
          if [ -s news.json ]; then
            node -e '
              const d = require("./news.json");
              console.log("Stand", d.fetchedAt, JSON.stringify(d.state), "Größe", JSON.stringify(d).length, "Bytes");
              for (const b of d.binance) console.log("BN", b.kind, b.imp, b.coins.join("/"), b.pairs ? b.pairs.join("/") : "", b.at ? new Date(b.at).toISOString().slice(0, 16) : "-", "|", b.title);
              for (const [k, l] of Object.entries(d.news)) for (const i of l) console.log("GN", k, i.imp, i.cat, new Date(i.t).toISOString().slice(5, 16), "+" + i.more, "|", i.outlet, "|", i.title);
            '
            code1=$(node -e 'console.log(require("./news.json").binance[0]?.code || "")')
            curl -sS -o /dev/null --max-time 20 -w "Binance-Seite (de): %{http_code}\n" -A "Mozilla/5.0" "https://www.binance.com/de/support/announcement/detail/${code1}" || true
          fi
