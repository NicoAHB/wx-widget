name: Krypto-Kalender
on:
  schedule:
    - cron: '29 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/krypto-kalender.yml', '.github/kalender/crypto.mjs', 'shared/crypto-calendar.mjs']
permissions:
  contents: write
concurrency:
  group: krypto-kalender
  cancel-in-progress: false
jobs:
  kalender:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/kalender
            shared
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Öffentlichen Kalender ohne Schlüssel lesen
        id: collect
        run: |
          calendar_ready=0
          # Nur die öffentliche Kalenderseite; keine Nutzerdaten oder Zugangsdaten.
          # Cloudflare kann GitHub-IP-Adressen ablehnen. Der freie Reader liefert
          # dieselbe HTML-Seite, die der unveränderte Collector streng als JSON liest.
          for calendar_endpoint in https://coinmarketcal.com/en/ https://r.jina.ai/https://coinmarketcal.com/en; do
            if curl --fail --location --max-redirs 3 --proto '=https' --proto-redir '=https' \
                --silent --show-error --max-time 45 --max-filesize 2097152 \
                -A "ScalpDesk-Kalender (github.com/${GITHUB_REPOSITORY})" \
                -H 'X-Return-Format: html' "$calendar_endpoint" -o public-calendar.html \
                && node .github/kalender/crypto.mjs public-calendar.html > crypto-calendar.json; then
              calendar_ready=1
              break
            fi
            echo "::notice::Kalenderabruf fehlgeschlagen; nächsten öffentlichen Abrufweg prüfen."
          done
          if [ "$calendar_ready" != 1 ]; then
            echo "::warning::Öffentlicher Krypto-Kalender nicht erreichbar oder Format geändert; letzter Stand bleibt."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Auszug separat veröffentlichen
        if: steps.collect.outputs.skip != '1'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out && cp crypto-calendar.json out/ && cd out
          git init -q -b krypto-kalender
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto-calendar.json
          git commit -q -m "Krypto-Kalender $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" krypto-kalender
